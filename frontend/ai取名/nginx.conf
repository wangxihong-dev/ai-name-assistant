# =============================================
# Nginx：一个容器托管三样东西 + 反向代理后端 API
#   /       门户（portal/index.html，纯静态单文件）
#   /app/   取名应用（UniApp H5，单页应用，base 在 manifest.json 里设成了 /app/）
#   /blog/  技术博客（VitePress 构建产物，base 在 blog/docs/.vitepress/config.mts 里设成了 /blog/）
#   /auth/ /name/ /chat/   后端接口
# =============================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 门户（根路径，精确匹配优先）----------
    location = / {
        try_files /index.html =404;
    }

    # ---------- 取名应用：单页应用，找不到文件就回退到它自己的 index.html ----------
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # ---------- 技术博客：纯静态 ----------
    # $uri.html 是为了兼容 VitePress 的 cleanUrls 选项；默认配置下链接本来就带 .html
    location /blog/ {
        try_files $uri $uri/ $uri.html /blog/404.html;
    }

    # ---------- 后端 API ----------
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /name/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 对话版接口。其中 /chat/stream 是 SSE（服务器推送事件），
    # 必须关掉 nginx 的缓冲，否则事件会被攒到最后一次性吐出来，流式就白做了。
    # proxy_http_version 1.1 + 空的 Connection 头，是为了让上游连接保持长连接。
    location /chat/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        # 一轮对话实测 2~20 秒，流式连接还要一直开着，所以比默认的 120s 放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其它路径一律 404。不要回退到门户——
    # 回退会让人以为这个路径存在，排查问题时会被带偏。
    location / {
        try_files $uri $uri/ =404;
    }

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
